<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <title>VolleyBox - Transmisión en vivo</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141821;
      --panel-soft: #1b2130;
      --text: #f6f7fb;
      --muted: #aeb6c7;
      --line: rgba(255, 255, 255, 0.12);
      --live: #ff334f;
      --accent: #ffbc3a;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 0;
      background: var(--bg);
    }

    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(255, 188, 58, 0.16), transparent 32rem),
        linear-gradient(180deg, #101520 0%, var(--bg) 46%, #07080c 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }

    .page {
      width: min(100%, 1100px);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        max(22px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .header {
      display: grid;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.15rem, 9vw, 4.8rem);
      line-height: 1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .live-badge {
      width: fit-content;
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 51, 79, 0.45);
      border-radius: 999px;
      background: rgba(255, 51, 79, 0.12);
      color: #ffdfe4;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 0 6px rgba(255, 51, 79, 0.16);
      flex: 0 0 auto;
    }

    .scoreboard {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(20, 24, 33, 0.72);
    }

    .scoreboard.waiting {
      display: block;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .team {
      min-width: 0;
      display: grid;
      gap: 2px;
      text-align: center;
    }

    .team-name {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: clamp(0.72rem, 3vw, 0.95rem);
      font-weight: 800;
      letter-spacing: 0;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .team-score {
      color: var(--accent);
      font-size: clamp(2.15rem, 15vw, 5.4rem);
      font-weight: 900;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }

    .team-sets {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .match-state {
      display: grid;
      gap: 5px;
      justify-items: center;
      min-width: 64px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .match-state strong {
      color: var(--text);
      font-size: clamp(0.9rem, 3.4vw, 1.2rem);
      line-height: 1;
    }

    .match-state span {
      color: #ffdfe4;
      font-size: 0.72rem;
    }

    .player-card {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background:
        linear-gradient(135deg, rgba(255, 188, 58, 0.08), transparent 38%),
        var(--panel-soft);
    }

    .player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
    }

    @media (max-width: 420px) {
      .page {
        justify-content: flex-start;
        padding-top: max(24px, env(safe-area-inset-top));
      }

      .player-card {
        border-radius: 12px;
      }

      .live-badge {
        font-size: 0.72rem;
        padding: 7px 10px;
      }

      .scoreboard {
        gap: 6px;
        padding: 10px 8px;
      }

      .match-state {
        min-width: 54px;
      }
    }

    @media (orientation: landscape) {
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #07080c;
      }

      .page {
        width: 100%;
        max-width: none;
        height: 100dvh;
        min-height: 0;
        padding:
          max(8px, env(safe-area-inset-top))
          max(8px, env(safe-area-inset-right))
          max(8px, env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .header,
      .note {
        display: none;
      }

      .player-card {
        order: 1;
        flex: 0 1 81%;
        width: min(81%, calc((100dvh - 16px) * 16 / 9));
        max-width: 82%;
        max-height: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        box-shadow: none;
      }

      .player {
        width: 100%;
        height: 100%;
      }

      .scoreboard {
        order: 2;
        flex: 1 1 19%;
        align-self: stretch;
        min-width: 112px;
        max-width: 21%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
        gap: 4px;
        padding: 8px 6px;
        border-radius: 10px;
        overflow: hidden;
      }

      .scoreboard.waiting {
        display: grid;
        place-items: center;
        font-size: clamp(0.72rem, 2.5dvh, 0.95rem);
        line-height: 1.15;
      }

      .team {
        align-content: center;
        gap: 2px;
      }

      .team-name {
        font-size: clamp(0.62rem, 3dvh, 0.95rem);
        line-height: 1.05;
      }

      .team-score {
        font-size: clamp(1.65rem, 14dvh, 4.8rem);
        line-height: 0.9;
      }

      .team-sets {
        font-size: clamp(0.55rem, 2.3dvh, 0.72rem);
        line-height: 1;
      }

      .match-state {
        min-width: 0;
        gap: 3px;
        font-size: clamp(0.55rem, 2.2dvh, 0.72rem);
        line-height: 1;
      }

      .match-state strong {
        font-size: clamp(0.72rem, 3.4dvh, 1rem);
      }

      .match-state span {
        font-size: clamp(0.55rem, 2.2dvh, 0.72rem);
      }

      .scoreboard .team:last-child .team-score {
        order: 1;
      }

      .scoreboard .team:last-child .team-sets {
        order: 2;
      }

      .scoreboard .team:last-child .team-name {
        order: 3;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <header class="header">
      <h1 id="page-title">🏐 VolleyBox</h1>
      <div class="live-badge" aria-label="Transmisión en vivo">
        <span class="live-dot" aria-hidden="true"></span>
        🔴 TRANSMISIÓN EN VIVO
      </div>
    </header>

    <section class="scoreboard waiting" id="scoreboard" aria-live="polite">
      Esperando marcador...
    </section>

    <section class="player-card" aria-label="Reproductor de la transmisión en vivo">
      <div class="player">
        <iframe
          src="https://customer-fyr6gx6rae9ki9kh.cloudflarestream.com/f1bbdb0cdde1d56a4bd23202176abfee/iframe"
          title="VolleyBox - Transmisión en vivo"
          allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen
          webkitallowfullscreen
          mozallowfullscreen>
        </iframe>
      </div>
    </section>

    <p class="note">Transmisión para familiares y apoderados.</p>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDF2YOoG6WW5y_K2zzFWCE7ES1gSIrPcFY",
      authDomain: "volleyscore-a9791.firebaseapp.com",
      databaseURL: "https://volleyscore-a9791-default-rtdb.firebaseio.com",
      projectId: "volleyscore-a9791",
      storageBucket: "volleyscore-a9791.firebasestorage.app",
      messagingSenderId: "153085028292",
      appId: "1:153085028292:web:0a54f1a8ac2fe5f2246691"
    };

    const params = new URLSearchParams(location.search);
    const scoreChannel = params.get("vivo") || params.get("t") || "varones";
    const scoreboard = document.getElementById("scoreboard");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function asList(value) {
      if (Array.isArray(value)) return value.filter(Boolean);
      if (value && typeof value === "object") return Object.values(value).filter(Boolean);
      return [];
    }

    function renderWaiting() {
      scoreboard.className = "scoreboard waiting";
      scoreboard.textContent = "Esperando marcador...";
    }

    function teamName(teams, id, fallback) {
      if (!id) return fallback || "Equipo";
      const team = teams.find((item) => item && item.id === id);
      return team && team.nombre ? team.nombre : fallback || "Equipo";
    }

    function renderMatch(match, teams) {
      const setNumber = (asList(match.sets).length || 0) + 1;
      const nameA = teamName(teams, match.a, match.aLabel || "Equipo A");
      const nameB = teamName(teams, match.b, match.bLabel || "Equipo B");

      scoreboard.className = "scoreboard";
      scoreboard.innerHTML = `
        <div class="team">
          <div class="team-name">${esc(nameA)}</div>
          <div class="team-score">${Number(match.curA || 0)}</div>
          <div class="team-sets">Sets ${Number(match.setsA || 0)}</div>
        </div>
        <div class="match-state">
          <strong>SET ${setNumber}</strong>
          <span>🔴 EN VIVO</span>
        </div>
        <div class="team">
          <div class="team-name">${esc(nameB)}</div>
          <div class="team-score">${Number(match.curB || 0)}</div>
          <div class="team-sets">Sets ${Number(match.setsB || 0)}</div>
        </div>
      `;
    }

    function handleScoreSnapshot(snapshot) {
      const data = snapshot.val();
      if (!data) {
        renderWaiting();
        return;
      }

      const teams = asList(data.equipos);
      const matches = asList(data.partidos).map((match) => ({
        sets: [],
        ...match
      }));
      const liveMatches = matches.filter((match) => match.estado === "en juego");

      if (!liveMatches.length) {
        renderWaiting();
        return;
      }

      renderMatch(liveMatches[0], teams);
    }

    try {
      firebase.initializeApp(firebaseConfig);
      firebase.database().ref(`torneos/${scoreChannel}`).on("value", handleScoreSnapshot, () => {
        renderWaiting();
      });
    } catch (error) {
      console.warn("No se pudo conectar el marcador en vivo.", error);
      renderWaiting();
    }
  </script>
</body>
</html>
